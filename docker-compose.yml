version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
      - backend-data:/data
    environment:
      - RUNNER_URL=http://runner:8000
      - CONFIG_PATH=/config/config.yaml
    networks:
      - default
  runner:
    build: ./runner
    volumes:
      - ./config:/config
      - ./backups:/backups
    ports:
      - 8000:8000
    environment:
      - BACKEND_URL=http://backend:8080
      - CONFIG_PATH=/config/config.yaml
    depends_on:
      - backend
    networks:
      - default
  postgres:
    image: postgres:17
    container_name: postgres17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - default
  mongo:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=secret
      - MONGO_INITDB_DATABASE=analytics
    volumes:
      - mongo-data:/data/db
    ports:
      - 27017:27017
    networks:
      - default
volumes:
  postgres-data:
  mongo-data:
  backend-data:
networks:
  default:
