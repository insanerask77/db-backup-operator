backups:
  - name: postgres-main
    type: postgres
    host: postgres
    port: 5432
    user: postgres
    password: postgres
    database: postgres
    schedule: "0 */6 * * *"
    backup_on_start: true
    compression: none
    encrypt: none
    encrypt_key: /keys/public.gpg
    checksum: md5
    retention:
      keep_last: 30
    storage:
      path: /backups/postgres
      type: pvc
  - name: mongo-analytics
    type: mongo
    uri: mongodb://root:secret@mongo:27017/analytics
    schedule: "0 0 * * *"
    compression: zstd
    retention:
      days: 14
    storage:
      path: /backups/mongo
      type: nfs
