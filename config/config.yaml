backups:
  - name: postgres-main
    type: postgres
    host: postgres
    port: 5432
    user: postgres
    password: postgres
    database: postgres
    schedule: "0 */6 * * *"
    backup_on_start: true
    compression: gzip
    checksum: md5
    retention:
      keep_last: 3
    storage:
      path: /backups
  - name: mongo
    type: mongo
    uri: mongodb://root:secret@mongo:27017/analytics?authSource=admin
    schedule: "0 0 * * *"
    compression: zstd
    retention:
      days: 14
    storage:
      path: /backups
