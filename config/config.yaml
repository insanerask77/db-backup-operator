backups:
  - name: postgres-main
    type: postgres
    host: db-postgres
    port: 5432
    user: backup
    password: secret
    database: myapp
    schedule: "0 */6 * * *"
    backup_on_start: true
    compression: gzip
    encrypt: true
    encrypt_key: /keys/public.gpg
    checksum: md5
    retention:
      keep_last: 30
    storage:
      path: /backups/postgres
      type: pvc
  - name: mongo-analytics
    type: mongo
    uri: mongodb://backup:secret@mongo:27017/analytics
    schedule: "0 0 * * *"
    compression: zstd
    retention:
      days: 14
    storage:
      path: /backups/mongo
      type: nfs
